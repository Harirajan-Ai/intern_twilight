<!DOCTYPE html>
<!-- Defines this document as an HTML5 page -->

<html lang="en">
<!-- Starts the HTML document and sets the language to English -->

<head>
  <!-- Contains information about the webpage -->

  <meta charset="UTF-8">
  <!-- Sets the character encoding to UTF-8 -->

  <title>About Me</title>
  <!-- Sets the title shown in the browser tab -->

  <style>
    /* Starts the CSS section */

    body {
      /* Styles the entire page */
      font-family:   Arial, sans-serif;
      /* Sets the font */
      background-color:black
      /* Sets a light gray background */
      text-align: center;
      /* Centers the text */
      padding: 40px;
      /* Adds space around the content */

    }

    h1 {
      /* Styles the main heading */
      color: lightblue;
      /* Sets the heading color */
    }

    p {
      /* Styles paragraphs */
      color: lightsalmon;
      /* Sets the paragraph color */
      font-size: 18px;
      /* Makes the text larger */
    }
    h2 {
        color:lightgoldenrodyellow;
    }

    ul {
        color:lime;

      list-style-position: inside;
      /* Keeps bullet points close to the text */
      border-radius: 6px;
      border-color: beige;
    }
    button {
        color-scheme: inherit;
        color: black ;

    }
  </style>
  <!-- Ends the CSS section -->
</head>
